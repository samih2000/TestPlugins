name: Search backfill (old X videos)

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: "Account names, comma separated. Empty = every account in accounts.json"
        default: ""
      pages:
        description: "Search pages per account (~20-40 tweets each)"
        default: "10"
      until:
        description: "Only tweets before this date (YYYY-MM-DD). Empty = no limit"
        default: ""
      dry:
        description: "Dry run: print what would be added, save nothing (true/false)"
        default: "true"

concurrency:
  group: xsync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run search backfill
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          ACCOUNTS: ${{ github.event.inputs.accounts }}
          PAGES: ${{ github.event.inputs.pages }}
          UNTIL: ${{ github.event.inputs.until }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          ARGS="--pages ${PAGES:-10}"
          [ -n "$ACCOUNTS" ] && ARGS="$ARGS --accounts $ACCOUNTS"
          [ -n "$UNTIL" ] && ARGS="$ARGS --until $UNTIL"
          [ "$DRY" != "false" ] && ARGS="$ARGS --dry"
          python tools/xsync/search_backfill.py $ARGS
